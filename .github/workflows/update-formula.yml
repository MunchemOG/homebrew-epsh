name: Update Epsh Formula

on:
  repository_dispatch:
    types: [epsh-release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to process'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Get release information
        id: release
        env:
          GH_TOKEN: ${{ secrets.EPSH_READ_TOKEN }}
        run: |
          gh api repos/MunchemOG/epsh --jq '.full_name, .private' || echo "REPO ACCESS FAILED"
          gh release list --repo MunchemOG/ElectroPush || echo "RELEASE LIST FAILED"
          # Get the latest release from MunchemOG/epsh
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ "${{ github.event.action }}" = "epsh-release" ]; then
            TAG="${{ github.event.client_payload.tag }}"
          else
            TAG=$(gh release list --repo MunchemOG/ElectroPush --limit 1 --json tagName --jq '.[0].tagName')
          fi
          
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          
          # Get release body
          RELEASE_BODY=$(gh release view "$TAG" --repo MunchemOG/ElectroPush --json body --jq '.body')
          echo "Release body:"
          echo "$RELEASE_BODY"
          
          # Extract URL, SHA256, and VERSION from the ruby block in release body
          URL=$(echo "$RELEASE_BODY" | grep -oP 'url\s+"https://github.com/[^"]+\.tar\.gz"' | grep -oP 'https://[^"]+')
          SHA256=$(echo "$RELEASE_BODY" | grep -oP 'sha256\s+"[a-f0-9]{64}"' | grep -oP '[a-f0-9]{64}')
          VERSION=$(echo "$RELEASE_BODY" | grep -oP 'version\s+"[^"]+"' | grep -oP '"[^"]+"' | tr -d '"')
          
          echo "Extracted values:"
          echo "URL: $URL"
          echo "SHA256: $SHA256"
          echo "VERSION: $VERSION"
          
          echo "URL=$URL" >> $GITHUB_OUTPUT
          echo "SHA256=$SHA256" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Update epsh.rb formula
        run: |
          # Update the formula file
          sed -i "s|url \".*\"|url \"${{ steps.release.outputs.URL }}\"|g" Formula/epsh.rb
          sed -i "s|sha256 \".*\"|sha256 \"${{ steps.release.outputs.SHA256 }}\"|g" Formula/epsh.rb
          sed -i "s|version \".*\"|version \"${{ steps.release.outputs.VERSION }}\"|g" Formula/epsh.rb
          
          echo "Updated Formula/epsh.rb:"
          cat Formula/epsh.rb

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/epsh.rb
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update epsh formula to version ${{ steps.release.outputs.VERSION }}"
            git push
          fi
